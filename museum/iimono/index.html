    intensity="7"
    angle="20"
    penumbra="0.3">
  </a-light>
  <a-entity id="spot-t3" position="1.45 2.7 -9.6"></a-entity>

  <a-light
    type="spot"
    position="4.7 5.2 -7.4"
    target="#spot-t4"
    color="#fff0d8"
    intensity="7"
    angle="20"
    penumbra="0.3">
  </a-light>
  <a-entity id="spot-t4" position="4.7 2.7 -9.6"></a-entity>

  <!-- カメラ -->
  <a-entity position="0 0 1.4">
    <a-camera position="0 1.65 0" camera="fov: 68">
      <a-cursor
        color="#0f7a45"
        raycaster="objects: .clickable">
      </a-cursor>
    </a-camera>
  </a-entity>

</a-scene>

<script>
  document.addEventListener('DOMContentLoaded', function () {

    document.querySelectorAll('.clickable').forEach(function (element) {

      element.addEventListener('click', function () {
        const url = element.getAttribute('data-url');
        const target = element.getAttribute('data-target') || '_self';

        if (!url) {
          alert('このページまたはGoogleマップは現在準備中です。');
          return;
        }

        window.open(url, target);
      });

      element.addEventListener('mouseenter', function () {
        element.setAttribute(
          'animation__in',
          'property: scale; to: 1.06 1.06 1.06; dur: 140'
        );
      });

      element.addEventListener('mouseleave', function () {
        element.setAttribute(
          'animation__out',
          'property: scale; to: 1 1 1; dur: 140'
        );
      });

    });

  });
</script>

</body>
</html>
