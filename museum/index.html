  <style>
    :root{
      /* ===== Design tokens ===== */
      --ink-950:#0a0a0a;
      --ink-900:#111111;
      --ink-800:#1c1c1c;
      --teal-700:#6d5320;
      --foam-100:#f6e6bf;
      --brass-300:#d9b45a;
      --brass-500:#e6c778;
      --brass-700:#a8802c;
      --coral-500:#d4af37;
      --glass-200:rgba(246,228,178,0.95);

      --font-display:'Shippori Mincho', serif;
      --font-ui:'Zen Kaku Gothic New', sans-serif;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin: 0;
      overflow: hidden;
      background: var(--ink-950);
      font-family: var(--font-ui);
    }

    a-scene{
      cursor: default;
    }

    /* ===== ローディング画面 ===== */
    #loading{
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(120% 90% at 50% 30%, #0b0b0c 0%, #08080a 55%, #000000 100%);
      transition: opacity .7s ease, visibility .7s ease;
    }
    #loading.hide{
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #loading .mark{
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brass-300);
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: .04em;
      position: relative;
    }
    #loading .mark::after{
      content:"";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,.3);
      border-top-color: var(--brass-500);
      animation: spin 1.4s linear infinite;
    }
    #loading .word{
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: .38em;
      color: #f0d9a0;
      text-transform: uppercase;
      padding-left: .38em; /* optical letter-spacing correction */
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    /* ===== 案内ピル ===== */
    #guide {
      position: fixed;
      top: 20px;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%) translateY(-6px);
      padding: 11px 22px;
      border: 1px solid rgba(212,175,55,.45);
      border-radius: 999px;
      background: rgba(10,10,10,.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #f0d9a0;
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: .06em;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
      transition: opacity .8s ease .3s, transform .8s ease .3s;
    }
    #guide.show{
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #guide .dot{
      display:inline-block;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--brass-500);
      margin: 0 8px;
      vertical-align: middle;
    }

    /* ===== 左上ブランドマーク ===== */
    #brandmark{
      position: fixed;
      top: 20px;
      left: 22px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .8s ease .5s, transform .8s ease .5s;
      pointer-events: none;
    }
    #brandmark.show{ opacity: 1; transform: translateY(0); }
    #brandmark .ring{
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(212,175,55,.5);
      display: flex; align-items: center; justify-content: center;
      color: var(--brass-300);
      font-family: var(--font-display);
      font-size: 13px;
    }
    #brandmark .label{
      color: #f0d9a0;
      font-size: 10px;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    /* ===== 画面端の落ち着いたビネット ===== */
    #vignette{
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(120% 100% at 50% 50%, rgba(255,255,255,0) 52%, rgba(0,0,0,.55) 100%);
    }
  </style>
</head>

<script>
  /* =========================================================
     和文テキストを綺麗なフォントで描画し、テクスチャとして
     a-image に流し込むユーティリティ。
     （A-Frame 標準フォントは和文グリフを含まないため）
  ========================================================== */
  function makeLabelTexture(text, {
    aspect = 6.7,
    height = 200,
    fontFamily = "'Shippori Mincho', serif",
    weight = 600,
    color = '#f4dda2',
    letterSpacing = 0.05,
    fontRatio = 0.5,
    padX = 0.05,
    plate = null,
    plateBorder = null,
    shadow = 'rgba(0, 0, 0, 0.7)'
  } = {}) {
    const H = Math.round(height * 2);
    const W = Math.round(H * aspect);
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    /* 銘板（プレート）の下地。背景と文字のコントラストを確保する */
    if (plate) {
      const r = H * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 1);
      ctx.lineTo(W - r, 1);
      ctx.quadraticCurveTo(W - 1, 1, W - 1, r);
      ctx.lineTo(W - 1, H - r);
      ctx.quadraticCurveTo(W - 1, H - 1, W - r, H - 1);
      ctx.lineTo(r, H - 1);
      ctx.quadraticCurveTo(1, H - 1, 1, H - r);
      ctx.lineTo(1, r);
      ctx.quadraticCurveTo(1, 1, r, 1);
      ctx.closePath();
      ctx.fillStyle = plate;
      ctx.fill();
      if (plateBorder) {
        ctx.lineWidth = Math.max(2, H * 0.03);
        ctx.strokeStyle = plateBorder;
        ctx.stroke();
      }
    }

    const chars = Array.from(text);
    function measure(size) {
      ctx.font = weight + ' ' + size + 'px ' + fontFamily;
      const sp = letterSpacing * size;
      let total = 0;
      chars.forEach(function (c) { total += ctx.measureText(c).width + sp; });
      return total - sp;
    }

    /* はみ出して文字が切れないよう、収まる大きさまで自動縮小する */
    let fontSize = H * fontRatio;
    let totalWidth = measure(fontSize);
    const maxWidth = W * (1 - padX * 2);
    if (totalWidth > maxWidth) {
      fontSize = fontSize * (maxWidth / totalWidth);
      totalWidth = measure(fontSize);
    }

    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.shadowColor = shadow;
    ctx.shadowBlur = fontSize * 0.22;
    ctx.shadowOffsetY = fontSize * 0.05;

    const spacing = letterSpacing * fontSize;
    let x = (W - totalWidth) / 2;
    chars.forEach(function (c) {
      ctx.fillText(c, x, H / 2 + fontSize * 0.02);
      x += ctx.measureText(c).width + spacing;
    });

    return canvas.toDataURL('image/png');
  }

  function applyLabel(id, text, opts) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('src', makeLabelTexture(text, opts));
  }

  async function buildLabels() {
    try {
      await Promise.all([
        document.fonts.load("700 96px 'Shippori Mincho'"),
        document.fonts.load("600 48px 'Zen Kaku Gothic New'")
      ]);
      await document.fonts.ready;
    } catch (e) { /* フォント読み込み失敗時も既定フォントで描画を続行 */ }

    applyLabel('label-title', 'ITO PEOPLE MUSEUM', {
      aspect: 6.6 / 0.95,
      height: 240,
      fontFamily: "'Shippori Mincho', serif",
      weight: 700,
      color: '#f0d999',
      letterSpacing: 0.1,
      fontRatio: 0.44,
      shadow: 'rgba(0, 0, 0, 0.85)'
    });

    applyLabel('label-subtitle', '伊東のヒト・商品・仕事の裏側を展示するデジタル博物館', {
      aspect: 5.6 / 0.42,
      height: 132,
      fontFamily: "'Zen Kaku Gothic New', sans-serif",
      weight: 600,
      color: '#f0d999',
      letterSpacing: 0.04,
      fontRatio: 0.62,
      shadow: 'rgba(0, 0, 0, 0.8)'
    });

    /* 部門名は明るい壁の上に置くため、濃色の銘板を敷いて可読性を上げる */
    const platePreset = {
      aspect: 2.68 / 0.4,
      height: 176,
      fontFamily: "'Shippori Mincho', serif",
      weight: 700,
      color: '#f4dda2',
      letterSpacing: 0.06,
      fontRatio: 0.52,
      padX: 0.07,
      plate: 'rgba(6, 6, 6, 0.95)',
      plateBorder: '#c9a227',
      shadow: 'rgba(0, 0, 0, 0.6)'
    };

    applyLabel('label-iimono', 'いとうのいいもの', platePreset);
    applyLabel('label-jizakana', '伊豆・いとう地魚王国', platePreset);
    applyLabel('label-okashi', '伊東お菓子ぃ共和国', platePreset);
    applyLabel('label-furusato', 'ふるさと納税', platePreset);
  }

  document.addEventListener('DOMContentLoaded', function () {

    buildLabels();

    document.querySelectorAll('.clickable').forEach(function (element) {

      element.addEventListener('click', function () {
        const url = element.getAttribute('data-url');
        const target = element.getAttribute('data-target') || '_self';

        if (!url) {
          alert('GoogleマイマップのURLは、後から設定してください。');
          return;
        }

        window.open(url, target);
      });

      element.addEventListener('mouseenter', function () {
        element.setAttribute(
          'animation__hoverin',
          'property: scale; to: 1.08 1.08 1.08; dur: 140'
        );
      });

      element.addEventListener('mouseleave', function () {
        element.setAttribute(
          'animation__hoverout',
          'property: scale; to: 1 1 1; dur: 140'
        );
      });

    });

    const guide = document.getElementById('guide');
    const brandmark = document.getElementById('brandmark');
    const loading = document.getElementById('loading');
    const scene = document.querySelector('a-scene');

    function reveal() {
      loading.classList.add('hide');
      requestAnimationFrame(function () {
        guide.classList.add('show');
        brandmark.classList.add('show');
      });
      setTimeout(function () {
        guide.classList.remove('show');
      }, 6500);
    }

    if (scene.hasLoaded) {
      reveal();
    } else {
      scene.addEventListener('loaded', reveal);
    }

    // 万一アセット読み込みが長引いた場合の保険
    setTimeout(reveal, 4500);

  });
</script>
